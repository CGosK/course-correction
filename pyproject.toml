[project]
name = "course-correction"
version = "0.1.0"
description = "Do models change course when the evidence says they should? An Inspect eval."
requires-python = ">=3.12"
dependencies = [
    "inspect-ai==0.3.263",
    "anthropic==1.5.0",
    "pandas==3.0.5",
    "pyyaml==6.0.3",
    "pyarrow>=22",
    # inspect-ai 0.3.263 imports acp.helpers, which 1.0 removed; without this pin a fresh install breaks
    "agent-client-protocol==0.12.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.7",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]

[project.entry-points.inspect_ai]
course_correction = "course_correction._registry"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["rkit"]  # vendored from the research kit; see rkit/SOURCE.md

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# embedded CSS and HTML; line length is not meaningful there
"scripts/render_scenarios.py" = ["E501"]
"scripts/make_label_set.py" = ["E501"]
"scripts/claims.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: runs a full eval loop on mock models"]
